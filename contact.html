<!DOCTYPE html>
<html>

<head>
    <title>Contact Me</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>Get In Touch</h1>
  <p class="contact-intro">I’d love to hear from you. Feel free to send me a message using the form below.</p>

    <p>You can contact me using the form below.</p>
      <form id="contactForm">
        <label for="name">Name:</label><br>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label for="email">Email:</label><br>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="message">Message:</label><br>
        <textarea id="contactMessage" placeholder="Write your message" required></textarea>

        <button type="submit">Send Message</button>
    </form>

    <br>

    <a href="index.html" class="home-btn">Back to Home</a>
<script src="js/script.js"></script>
</body>

</html>
